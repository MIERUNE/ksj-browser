name: Release plugin

on:
  release:
    types: [published]

# Release に ZIP を添付するため contents: write が要る。lint.yaml・test.yaml の read は変えない。
permissions:
  contents: write

env:
  PACKAGE_NAME: ksj_browser

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # secrets は if: で直接参照できないため、有無だけをジョブの env に写して判定する。実値は投稿ステップにだけ渡す。
      HAS_QGIS_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN != '' }}
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      # 版はタグだけで決める。metadata.txt の version={{PLUGIN_VERSION}} は、ZIP を作るときにこの版へ置き換わる。
      - name: タグから版を決める
        run: |
          version="${TAG_NAME#v}"
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$version"; then
            echo "::error::タグ $TAG_NAME は v<major>.<minor>.<patch> の形式ではありません"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "## リリース $TAG_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版: ${version}（タグから決定）" >> "$GITHUB_STEP_SUMMARY"

      - name: 配布 ZIP を作成
        run: |
          zip_path="$(bash scripts/build-plugin-zip.sh "$VERSION")"
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"

      - name: ZIP の内容を検査
        run: |
          if [ "$(basename "$ZIP_PATH")" != "$PACKAGE_NAME-$VERSION.zip" ]; then
            echo "::error::ZIP 名 $(basename "$ZIP_PATH") がタグの版 $VERSION と一致しません"
            exit 1
          fi
          entries="$(unzip -Z1 "$ZIP_PATH")"
          if grep -v "^$PACKAGE_NAME/" <<< "$entries"; then
            echo "::error::$PACKAGE_NAME/ の外に項目があります"
            exit 1
          fi
          zip_version="$(unzip -p "$ZIP_PATH" "$PACKAGE_NAME/metadata.txt" | sed -n 's/^version=//p')"
          if [ "$zip_version" != "$VERSION" ]; then
            echo "::error::ZIP の metadata.txt の version=$zip_version がタグの版 $VERSION と一致しません"
            exit 1
          fi
          icon="$(sed -n 's/^icon=//p' metadata.txt)"
          if [ -z "$icon" ]; then
            echo "::error::metadata.txt に icon= がありません"
            exit 1
          fi
          for required in metadata.txt __init__.py plugin.py LICENSE "$icon"; do
            if ! grep -qxF "$PACKAGE_NAME/$required" <<< "$entries"; then
              echo "::error::$PACKAGE_NAME/$required が ZIP にありません"
              exit 1
            fi
          done
          if grep -E '/(tests|specs|docs|imgs|scripts|__pycache__|\.github)/' <<< "$entries"; then
            echo "::error::配布に含めないディレクトリが ZIP にあります"
            exit 1
          fi
          # tests/test_plugin_package.py の ALLOWED と同じにする。ディレクトリ項目（末尾が /）は対象外。
          allowed="^$PACKAGE_NAME/(LICENSE|metadata\.txt|__init__\.py|plugin\.py|ksj/[a-z_]+\.py|ksj/catalog/[A-Za-z0-9_.-]+\.json|ksj/icons/[a-z-]+\.(svg|png))\$"
          if grep -vE "$allowed|/\$" <<< "$entries"; then
            echo "::error::許可していないファイルが ZIP にあります（上の一覧）"
            exit 1
          fi
          if [ -n "$(sort <<< "$entries" | uniq -d)" ]; then
            echo "::error::ZIP に同じパスの項目が重複しています"
            exit 1
          fi
          size="$(wc -c < "$ZIP_PATH" | tr -d ' ')"
          if [ "$size" -ge 25000000 ]; then
            echo "::error::ZIP が plugins.qgis.org の上限 25 MB 以上です（$size バイト）"
            exit 1
          fi
          echo "- ZIP: $(basename "$ZIP_PATH")（$size バイト、$(grep -vc '/$' <<< "$entries") ファイル）" >> "$GITHUB_STEP_SUMMARY"

      - name: Release に添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG_NAME" "$ZIP_PATH" --clobber
          echo "- Release に添付しました" >> "$GITHUB_STEP_SUMMARY"

      - name: plugins.qgis.org に投稿
        if: ${{ env.HAS_QGIS_TOKEN == 'true' && !github.event.release.prerelease }}
        env:
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        run: |
          if ! curl --fail-with-body --silent --show-error -X POST \
            "https://plugins.qgis.org/plugins/api/$PACKAGE_NAME/version/add/" \
            -H "Authorization: Bearer $QGIS_PLUGIN_TOKEN" \
            -F "package=@$ZIP_PATH" \
            -F "auto_approve_after_scan=true" \
            -o response.json; then
            echo "::error::plugins.qgis.org への投稿に失敗しました"
            cat response.json
            exit 1
          fi
          if ! jq -e '.success == true' response.json > /dev/null; then
            echo "::error::plugins.qgis.org の応答が成功の形式ではありません"
            cat response.json
            exit 1
          fi
          scan_url="$(jq -r '.scan_url // empty' response.json)"
          echo "- plugins.qgis.org に投稿しました。スキャン結果: https://plugins.qgis.org$scan_url" >> "$GITHUB_STEP_SUMMARY"

      - name: 投稿の省略を記録
        if: ${{ env.HAS_QGIS_TOKEN != 'true' || github.event.release.prerelease }}
        run: |
          if [ "$HAS_QGIS_TOKEN" != 'true' ]; then
            echo "- plugins.qgis.org への投稿は省略しました（シークレット QGIS_PLUGIN_TOKEN が未設定）。初回は Release の ZIP を Web から登録してください" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- plugins.qgis.org への投稿は省略しました（pre-release）" >> "$GITHUB_STEP_SUMMARY"
          fi
