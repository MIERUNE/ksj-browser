[project]
name = "qgis-plugin-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pytest-qgis>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-qgis>=2.0.0",
    "pyqt5-stubs>=5.15.6.0",
    "ruff>=0.8.2",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

