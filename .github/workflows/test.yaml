name: Test plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: QGIS ${{ matrix.qgis }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        qgis: ["3.44", "4.0-trixie", "4.2-trixie"]
    env:
      QGIS_TEST_IMAGE: qgis/qgis:${{ matrix.qgis }}
    steps:
      - uses: actions/checkout@v7
      - name: QGIS イメージを取得
        run: docker pull "$QGIS_TEST_IMAGE"
      - name: テストとカバレッジを実行
        run: bash scripts/test-docker.sh
      - name: カバレッジレポートを保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-qgis-${{ matrix.qgis }}
          path: coverage.xml
